# Throwaway helpers for verifying Gjallar on a kind cluster:
#   - registry: plain-HTTP OCI registry, a push target for Copa
#     (set buildkit.config to mark it http, see gjallar-docs: install-wsl.md)
#   - webhook:  echoes every request to its log, a stand-in for Slack/Teams
# kubectl apply -f kind/test-infra.yaml
apiVersion: v1
kind: Namespace
metadata: { name: gjallar-test }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: registry, namespace: gjallar-test }
spec:
  selector: { matchLabels: { app: registry } }
  template:
    metadata: { labels: { app: registry } }
    spec:
      containers:
        - name: registry
          image: registry:2.8.3
          ports: [{ containerPort: 5000 }]
---
apiVersion: v1
kind: Service
metadata: { name: registry, namespace: gjallar-test }
spec:
  selector: { app: registry }
  ports: [{ port: 5000, targetPort: 5000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: webhook, namespace: gjallar-test }
spec:
  selector: { matchLabels: { app: webhook } }
  template:
    metadata: { labels: { app: webhook } }
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:31
          env: [{ name: LOG_IGNORE_PATH, value: /healthz }]
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: webhook, namespace: gjallar-test }
spec:
  selector: { app: webhook }
  ports: [{ port: 80, targetPort: 8080 }]
